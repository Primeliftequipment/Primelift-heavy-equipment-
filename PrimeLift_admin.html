<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechavon Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:900px;margin:auto;padding:24px}
header{background:#111827;color:#fff;padding:22px 0}h1{margin:0;font-size:28px}
.card{background:#fff;border-radius:14px;padding:22px;margin:20px 0;box-shadow:0 4px 18px rgba(0,0,0,.08)}
label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:#111827;color:#fff;margin-top:16px}
button.secondary{background:#6b7280}.hidden{display:none}.msg{margin-top:14px;padding:12px;border-radius:8px;background:#eef2ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
.small{color:#6b7280;font-size:14px}.danger{color:#b91c1c}
</style>
</head>
<body>
<header><div class="wrap"><h1>Mechavon Heavy Equipment — Admin</h1></div></header>
<main class="wrap">

<section id="loginCard" class="card">
<h2>Admin Login</h2>
<p class="small">Use the Mechavon admin email and password you created in Supabase.</p>
<label>Email</label>
<input id="email" type="email" autocomplete="username" value="zeldawilson808@gmail.com">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">LOG IN</button>
<div id="loginMsg" class="msg hidden"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Add Equipment</h2>
<p class="small">Add a machine and one main photo. We can expand this to multiple photos after the first version is working.</p>
<div class="grid">
<div><label>Category</label>
<select id="category">
<option>Excavators</option><option>Wheel Loaders</option><option>Bulldozers</option>
<option>Forklifts</option><option>Backhoe Loaders</option><option>Other Equipment</option>
</select></div>
<div><label>Make</label><input id="make" placeholder="e.g. Caterpillar"></div>
<div><label>Model</label><input id="model" placeholder="e.g. 320D"></div>
<div><label>Year</label><input id="year" type="number" placeholder="e.g. 2019"></div>
<div><label>Hours</label><input id="hours" type="number" placeholder="e.g. 5200"></div>
<div><label>Price</label><input id="price" type="number" step="0.01" placeholder="e.g. 85000"></div>
</div>
<label>Condition</label><input id="condition" placeholder="e.g. Good / Very Good">
<label>Description</label><textarea id="description" placeholder="Describe the machine, specifications and availability"></textarea>
<label>Main Photo</label><input id="photo" type="file" accept="image/*">
<button id="saveBtn">SAVE EQUIPMENT</button>
<button id="logoutBtn" class="secondary">LOG OUT</button>
<div id="saveMsg" class="msg hidden"></div>
</div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  Mechavon CONFIGURATION
  Replace ONLY the two placeholder strings below.
  Never put a sb_secret_ key here.
*/
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);

function show(el, text, isError=false){
  el.classList.remove("hidden");
  el.textContent = text;
  el.style.background = isError ? "#fee2e2" : "#eef2ff";
}

async function checkAdmin(){
  const {data:{user}} = await client.auth.getUser();
  if(!user){ $("loginCard").classList.remove("hidden"); $("dashboard").classList.add("hidden"); return false; }
  const {data,error} = await client.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error || !data){
    await client.auth.signOut();
    show($("loginMsg"), "This account is not authorized as a Mechavon admin.", true);
    return false;
  }
  $("loginCard").classList.add("hidden"); $("dashboard").classList.remove("hidden"); return true;
}

$("loginBtn").onclick = async () => {
  show($("loginMsg"), "Signing in...");
  const {error} = await client.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if(error){ show($("loginMsg"), error.message, true); return; }
  await checkAdmin();
};

$("logoutBtn").onclick = async () => { await client.auth.signOut(); location.reload(); };

$("saveBtn").onclick = async () => {
  const saveMsg = $("saveMsg");
  show(saveMsg, "Saving equipment...");
  const photo = $("photo").files[0];
  let image_url = null;

  try {
    if(photo){
      const safeName = photo.name.toLowerCase().replace(/[^a-z0-9._-]/g,"-");
      const path = Date.now() + "-" + crypto.randomUUID() + "-" + safeName;
      const {error:uploadError} = await client.storage.from("equipment-images").upload(path, photo, {upsert:false});
      if(uploadError) throw uploadError;
      const {data:urlData} = client.storage.from("equipment-images").getPublicUrl(path);
      image_url = urlData.publicUrl;
    }

    const row = {
      category: $("category").value,
      make: $("make").value.trim(),
      model: $("model").value.trim(),
      year: $("year").value ? Number($("year").value) : null,
      hours: $("hours").value ? Number($("hours").value) : null,
      price: $("price").value ? Number($("price").value) : null,
      condition: $("condition").value.trim() || null,
      description: $("description").value.trim() || null,
      image_url
    };

    if(!row.make || !row.model) throw new Error("Make and model are required.");

    const {error} = await client.from("equipment").insert(row);
    if(error) throw error;

    show(saveMsg, "Equipment saved successfully.");
    ["make","model","year","hours","price","condition","description","photo"].forEach(id => $(id).value = "");
  } catch(err) {
    show(saveMsg, err.message || "Something went wrong.", true);
  }
};

checkAdmin();
</script>
</body>
</html>
